name: Build And Publish To CurseForge

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        required: false
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Optional changelog override for manual runs
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate publish secrets
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN}" ]]; then
            echo "Missing secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${CURSEFORGE_PROJECT_ID}" ]]; then
            echo "Missing variable: CURSEFORGE_PROJECT_ID" >&2
            exit 1
          fi
          if [[ -z "${CURSEFORGE_GAME_VERSIONS}" ]]; then
            echo "Missing variable: CURSEFORGE_GAME_VERSIONS" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build -x test

      - name: Resolve built jar
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "No built jar found in build/libs" >&2
            exit 1
          fi
          echo "jar_path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      - name: Determine release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail

          version="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)"
          if [[ -z "${version}" ]]; then
            echo "Failed to resolve mod_version from gradle.properties" >&2
            exit 1
          fi

          release_type="${INPUT_RELEASE_TYPE:-release}"
          if [[ "${EVENT_NAME}" == "release" ]]; then
            case "${{ github.event.release.prerelease }}" in
              true) release_type="beta" ;;
              false) release_type="release" ;;
            esac
          fi

          display_name="${RELEASE_NAME:-${version}}"
          changelog="$(awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/N;/^\n$/D')"

          if [[ -n "${INPUT_CHANGELOG}" ]]; then
            changelog="${INPUT_CHANGELOG}"
          elif [[ -z "${changelog}" && -n "${RELEASE_BODY}" ]]; then
            changelog="${RELEASE_BODY}"
          elif [[ -z "${changelog}" ]]; then
            changelog="Release ${version}"
          fi

          {
            echo "version=${version}"
            echo "release_type=${release_type}"
            echo "display_name<<EOF"
            echo "${display_name}"
            echo "EOF"
            echo "changelog<<EOF"
            echo "${changelog}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.jar_name }}
          path: ${{ steps.artifact.outputs.jar_path }}
          if-no-files-found: error

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
          CURSEFORGE_RELATIONS: ${{ vars.CURSEFORGE_RELATIONS }}
          FILE_PATH: ${{ steps.artifact.outputs.jar_path }}
          RELEASE_TYPE: ${{ steps.meta.outputs.release_type }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          set -euo pipefail

          game_versions_json="$(curl -fsSL \
            -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            https://minecraft.curseforge.com/api/game/versions)"

          resolve_version_id() {
            local raw="$1"
            local type_name=""
            local version_name="$raw"

            if [[ "$raw" == *:* ]]; then
              type_name="${raw%%:*}"
              version_name="${raw#*:}"
            fi

            local resolved_id=""
            if [[ -n "$type_name" ]]; then
              resolved_id="$(jq -r \
                --arg type_name "$type_name" \
                --arg version_name "$version_name" '
                  map(select(
                    ((.gameVersionTypeID | tostring) == $type_name) or
                    (.gameVersionTypeIDName? == $type_name) or
                    (.gameVersionTypeName? == $type_name)
                  ) | select(.name == $version_name or .slug == $version_name))
                  | .[0].id // empty
                ' <<<"$game_versions_json")"
            fi

            if [[ -z "$resolved_id" ]]; then
              resolved_id="$(jq -r \
                --arg version_name "$version_name" '
                  map(select(.name == $version_name or .slug == $version_name))
                  | .[0].id // empty
                ' <<<"$game_versions_json")"
            fi

            if [[ -z "$resolved_id" && "$version_name" =~ ^[0-9]+$ ]]; then
              resolved_id="$version_name"
            fi

            if [[ -z "$resolved_id" || "$resolved_id" == "null" ]]; then
              echo "Failed to resolve CurseForge game version: $raw" >&2
              exit 1
            fi

            printf '%s' "$resolved_id"
          }

          IFS=',' read -r -a requested_versions <<<"${CURSEFORGE_GAME_VERSIONS}"
          game_version_ids=()
          for version in "${requested_versions[@]}"; do
            trimmed="$(echo "$version" | xargs)"
            [[ -z "$trimmed" ]] && continue
            game_version_ids+=("$(resolve_version_id "$trimmed")")
          done

          if [[ ${#game_version_ids[@]} -eq 0 ]]; then
            echo "No CurseForge game versions resolved from CURSEFORGE_GAME_VERSIONS" >&2
            exit 1
          fi

          relations_json="null"
          if [[ -n "${CURSEFORGE_RELATIONS}" ]]; then
            relations_json="$(
              printf '%s' "${CURSEFORGE_RELATIONS}" | jq -Rn '
                [inputs
                 | split(",")
                 | map(select(length > 0))
                 | map(
                     split(":") as $parts
                     | if ($parts | length) != 2 then
                         error("Invalid CURSEFORGE_RELATIONS entry. Use slug:type")
                       else
                         {
                           slug: ($parts[0] | gsub("^\\s+|\\s+$"; "")),
                           type: ($parts[1] | gsub("^\\s+|\\s+$"; ""))
                         }
                       end
                   )]
                | {projects: .[0]}
              '
            )"
          fi

          metadata="$(
            jq -n \
              --arg changelog "$CHANGELOG" \
              --arg changelogType "markdown" \
              --arg displayName "$DISPLAY_NAME" \
              --arg releaseType "$RELEASE_TYPE" \
              --argjson gameVersions "$(printf '%s\n' "${game_version_ids[@]}" | jq -R . | jq -s 'map(tonumber)')" \
              --argjson relations "$relations_json" '
                {
                  changelog: $changelog,
                  changelogType: $changelogType,
                  displayName: $displayName,
                  gameVersions: $gameVersions,
                  releaseType: $releaseType
                }
                + (if $relations == null or ($relations.projects | length == 0) then {} else {relations: $relations} end)
              '
          )"

          response="$(
            curl -fsSL \
              -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
              -F "metadata=${metadata}" \
              -F "file=@${FILE_PATH}" \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"
          )"

          echo "CurseForge upload response: ${response}"
